<!DOCTYPE html>
<html>
<head>
<title>For Mani ❤️</title>
<style>
   body {
     margin: 0;
     overflow: hidden;
     font-family: Arial, sans-serif;
     text-align: center;
     height: 100vh;
     color: white;
     background: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7')
                 no-repeat center/cover;
   }
   .overlay {
     background: rgba(0,0,0,0.45);
     height: 100vh;
     width: 100%;
     position: absolute;
     top: 0;
     left: 0;
   }
   h1 {
     margin-top: 90px;
     font-size: 42px;
     text-shadow: 2px 2px 6px #ff4d6d;
     position: relative;
     z-index: 2;
   }
   #typing, #countdown, #loveMeter, #quote {
     position: relative;
     z-index: 2;
     margin-top: 8px;
   }
   button {
     padding: 12px 25px;
     font-size: 18px;
     border-radius: 10px;
     border: none;
     cursor: pointer;
     margin: 15px;
     transition: 0.3s;
     z-index: 2;
     position: relative;
   }
   #yesBtn {
     background: #ff4d6d;
     color: white;
   }
   #yesBtn:hover {
     transform: scale(1.2);
     background: #ff1e4d;
   }
   #noBtn {
     background: #333;
     color: white;
     position: relative;
   }
   .heart {
     position: absolute;
     font-size: 22px;
     animation: float 6s linear infinite;
   }
   @keyframes float {
     0% {transform: translateY(100vh);}
     100% {transform: translateY(-10vh);}
   }
   @keyframes shake {
     0%{transform:translateX(0);}
     25%{transform:translateX(-5px);}
     50%{transform:translateX(5px);}
     75%{transform:translateX(-5px);}
     100%{transform:translateX(0);}
   }
   input {
     padding: 8px;
     border-radius: 6px;
     border: none;
     margin-top: 10px;
     z-index: 2;
     position: relative;
   }
</style>
</head>
<body>
<div class="overlay"></div>
<h1>Mani 💖</h1>
<div id="typing"></div>
<div id="countdown"></div>
<div id="loveMeter"></div>
<div id="quote"></div>
<input id="secret" placeholder="Type Mani ❤️">
<br>
<button id="yesBtn" onclick="celebrate()">Yes 😍</button>
<button id="noBtn" onmouseover="moveButton()">No 😢</button>
<script>
/* Typing Text */
const text="Will You Be My Valentine?";
let i=0;
function typeWriter(){
if(i<text.length){
 document.getElementById("typing").innerHTML+=text.charAt(i);
 i++;
 setTimeout(typeWriter,80);
}
}
typeWriter();
/* Countdown */
let time=10;
setInterval(()=>{
if(time>=0){
 document.getElementById("countdown").innerHTML=
 "Decision loading in "+time+"s ⏳";
 time--;
}
},1000);
/* Love Meter */
let love=0;
let meter=setInterval(()=>{
love+=5;
document.getElementById("loveMeter").innerHTML=
"Compatibility with Mani: "+love+"% 💞";
if(love>=100) clearInterval(meter);
},150);
/* Quotes */
const quotes=[
"Mani, you auto-complete my heart 💻❤️",
"You are my favorite notification 🔔",
"Life compiled successfully with you 😄",
"No bugs when you smile 🐞✨"
];
setInterval(()=>{
document.getElementById("quote").innerHTML=
quotes[Math.floor(Math.random()*quotes.length)];
},3000);
/* Move No Button */
function moveButton(){
const btn=document.getElementById("noBtn");
btn.style.position="absolute";
btn.style.animation="shake 0.3s";
btn.style.top=Math.random()*400+"px";
btn.style.left=Math.random()*400+"px";
}
/* Celebration */
function celebrate(){
document.body.innerHTML=
"<h1 style='margin-top:200px;color:white'>Love U Mani ❤️🥳</h1>";
fireworks();
}
/* Fireworks */
function fireworks(){
for(let i=0;i<70;i++){
 const f=document.createElement("div");
 f.innerHTML="✨";
 f.style.position="absolute";
 f.style.left=Math.random()*100+"vw";
 f.style.top=Math.random()*100+"vh";
 f.style.fontSize="26px";
 document.body.appendChild(f);
}
}
/* Floating Hearts */
setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},300);
/* Cursor Trail */
document.addEventListener("mousemove",e=>{
const heart=document.createElement("div");
heart.innerHTML="💗";
heart.style.position="absolute";
heart.style.left=e.pageX+"px";
heart.style.top=e.pageY+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),700);
});
/* Secret Unlock */
document.getElementById("secret").addEventListener("input",e=>{
if(e.target.value.toLowerCase()==="mani"){
 alert("You unlocked my heart 🔓💖");
}
});
</script>
</body>
</html>
